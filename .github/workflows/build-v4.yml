name: Build JARVIS 4.0 Multi-Device

on:
  push:
    branches: [ jarvis-v4 ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-v4:
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore base project and JARVIS 4.0 sources
        shell: pwsh
        run: |
          python -c "import base64,pathlib; p=sorted(pathlib.Path('v3_payload').glob('part*')); raw=''.join(x.read_text().strip() for x in p); pathlib.Path('v3_payload/payload.tar.gz').write_bytes(base64.b64decode(raw))"
          tar -xzf v3_payload/payload.tar.gz

          python -c "import base64,pathlib; p=sorted(pathlib.Path('v4_payload').glob('part*')); raw=''.join(x.read_text().strip() for x in p); pathlib.Path('v4_payload/payload.tar.gz').write_bytes(base64.b64decode(raw))"
          tar -xzf v4_payload/payload.tar.gz

          Copy-Item v4/jarvis_server.py pc/jarvis_app.py -Force
          Copy-Item v4/requirements-build.txt pc/requirements-build.txt -Force
          Copy-Item v4/android/MainActivity.java android/app/src/main/java/com/levy/jarvis/MainActivity.java -Force
          Copy-Item v4/android/JarvisService.java android/app/src/main/java/com/levy/jarvis/JarvisService.java -Force
          Copy-Item v4/android/NetworkClient.java android/app/src/main/java/com/levy/jarvis/NetworkClient.java -Force
          Copy-Item v4/android/StateSocket.java android/app/src/main/java/com/levy/jarvis/StateSocket.java -Force
          Copy-Item v4/android/JarvisConfig.java android/app/src/main/java/com/levy/jarvis/JarvisConfig.java -Force
          Copy-Item v4/android/BootReceiver.java android/app/src/main/java/com/levy/jarvis/BootReceiver.java -Force
          Copy-Item v4/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml -Force
          Copy-Item v4/android/app-build.gradle android/app/build.gradle -Force
          [IO.File]::WriteAllBytes('android/jarvis-release.jks',[Convert]::FromBase64String((Get-Content v4/jarvis-release.jks.b64 -Raw).Trim()))
          Write-Host 'JARVIS 4.0 sources restored.'

      - name: Generate one pairing secret for PC and same APK
        shell: pwsh
        run: |
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $secret = -join ($bytes | ForEach-Object { $_.ToString('x2') })

          $pc = Get-Content pc/jarvis_app.py -Raw
          $pc = $pc.Replace('__JARVIS_SECRET__', $secret)
          Set-Content pc/jarvis_app.py $pc -Encoding utf8

          $cfg = 'android/app/src/main/java/com/levy/jarvis/JarvisConfig.java'
          $java = Get-Content $cfg -Raw
          $java = $java.Replace('__JARVIS_SECRET__', $secret)
          Set-Content $cfg $java -Encoding utf8
          Write-Host 'Pairing generated without printing secret.'

      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile pc/jarvis_app.py
          if (!(Select-String -Path android/app/build.gradle -Pattern 'minSdk 25' -Quiet)) { throw 'Android minSdk must be 25 for the tablet' }
          if (!(Test-Path android/jarvis-release.jks)) { throw 'Stable signing key missing' }

      - name: Install PC build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r pc/requirements-build.txt

      - name: Build Jarvis.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name Jarvis `
            --collect-all piper `
            --collect-all onnxruntime `
            --collect-all websockets `
            --hidden-import pystray._win32 `
            pc/jarvis_app.py
          if (!(Test-Path dist/Jarvis.exe)) { throw 'Jarvis.exe was not generated' }
          Get-Item dist/Jarvis.exe | Format-List Name,Length

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build the SAME Jarvis.apk for phone and tablet
        shell: pwsh
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          if (!(Test-Path app/build/outputs/apk/debug/app-debug.apk)) { throw 'Jarvis.apk was not generated' }

      - name: Prepare JARVIS 4.0 package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ready/app-android | Out-Null
          New-Item -ItemType Directory -Force ready/servidor | Out-Null
          New-Item -ItemType Directory -Force ready/painel-web | Out-Null
          Copy-Item android/app/build/outputs/apk/debug/app-debug.apk ready/app-android/Jarvis.apk
          Copy-Item dist/Jarvis.exe ready/servidor/Jarvis.exe
          Copy-Item v4/painel-web/index.html ready/painel-web/index.html

          @'
          J.A.R.V.I.S 4.0 — MULTI-DEVICE

          UM ÚNICO APK
          O mesmo app-android/Jarvis.apk funciona no celular e no tablet.
          Na primeira abertura escolha a função do aparelho:
          - Terminal Jarvis: celular principal, microfone e reprodução da voz.
          - Painel Jarvis: tablet, painel visual e controle remoto.
          A função pode ser trocada depois dentro do mesmo APK.

          COMPATIBILIDADE
          - Android mínimo: 7.1 / API 25.
          - Compatível com o tablet Samsung SM-T112NU em LineageOS 7.1.2.
          - Celular e tablet não executam IA pesada localmente.

          INSTALAÇÃO
          1. Extraia a pasta JARVIS_4_0 inteira.
          2. Abra servidor/Jarvis.exe no PC.
          3. Se você já usava o 3.1.1, o Jarvis tenta aproveitar a chave Groq salva. Caso contrário, use Configurar Groq.
          4. Se os Androids não encontrarem o PC, clique uma vez em Liberar Firewall e aceite o UAC.
          5. Conecte o celular por USB e use Instalar APK no Android. Escolha Terminal Jarvis.
          6. Faça o mesmo no tablet e escolha Painel Jarvis. É exatamente o MESMO APK.
          7. Depois da instalação, USB não é necessário. O uso normal é pela mesma rede Wi-Fi.
          8. No PC, clique Abrir painel web ou acesse http://IP-DO-PC:8765.

          SINCRONIZAÇÃO
          - HTTP: porta 8765
          - WebSocket em tempo real: porta 8766
          - Descoberta na rede: UDP 47665
          - Microfone, voz, volume, estados, último comando e resposta são compartilhados.
          - Desligar o microfone pelo tablet ou painel web faz o Terminal parar de escutar.
          - Mutar a voz do Jarvis não precisa alterar o volume da música do celular.

          IA E VOZ
          - STT: Groq Whisper Large V3 Turbo.
          - IA: Groq GPT-OSS 20B.
          - TTS: Piper Cadu, voz masculina pt-BR, gerada no PC.
          - Sem modelo pesado no celular/tablet.

          SEGURANÇA
          - O APK e o servidor usam um segredo de pareamento gerado juntos na compilação.
          - A chave da Groq fica protegida no Windows e não é colocada no APK.
          - Ações de automação continuam em lista permitida; o modelo não recebe shell arbitrário.
          - Esta linha 4.x usa uma chave de assinatura estável para permitir atualizações futuras.
          - Ao migrar de uma versão antiga com assinatura diferente, a primeira instalação 4.0 pode remover o APK antigo antes de instalar.
          '@ | Set-Content ready/README.txt -Encoding utf8

          Compress-Archive -Path ready/* -DestinationPath JARVIS_4_0_MULTI_DEVICE.zip -Force
          Get-ChildItem ready -Recurse | Format-Table FullName,Length
          Get-Item JARVIS_4_0_MULTI_DEVICE.zip | Format-List Name,Length

      - name: Upload JARVIS 4.0 final package
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-4.0-MULTI-DEVICE
          path: JARVIS_4_0_MULTI_DEVICE.zip
          retention-days: 30
          compression-level: 0

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh issue create --title "JARVIS 4.0 MULTI-DEVICE build SUCESSO - run $env:GITHUB_RUN_ID" --body "Um APK para Terminal/Painel + servidor PC + painel web + WebSocket. Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh issue create --title "JARVIS 4.0 MULTI-DEVICE build FALHOU - run $env:GITHUB_RUN_ID" --body "A build JARVIS 4.0 falhou. Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
