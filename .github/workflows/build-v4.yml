name: Build JARVIS 4.1 Multi-Device

on:
  push:
    branches: [ jarvis-v4 ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-v41:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore JARVIS 4 base and apply 4.1 fixes
        shell: pwsh
        run: |
          python -c "import base64,pathlib; p=sorted(pathlib.Path('v3_payload').glob('part*')); raw=''.join(x.read_text().strip() for x in p); pathlib.Path('v3_payload/payload.tar.gz').write_bytes(base64.b64decode(raw))"
          tar -xzf v3_payload/payload.tar.gz
          python -c "import base64,pathlib; p=sorted(pathlib.Path('v4_payload').glob('part*')); raw=''.join(x.read_text().strip() for x in p); pathlib.Path('v4_payload/payload.tar.gz').write_bytes(base64.b64decode(raw))"
          tar -xzf v4_payload/payload.tar.gz

          Copy-Item v4/jarvis_server.py pc/jarvis_app.py -Force
          Copy-Item v4/requirements-build.txt pc/requirements-build.txt -Force
          Copy-Item v4/android/MainActivity.java android/app/src/main/java/com/levy/jarvis/MainActivity.java -Force
          Copy-Item v4/android/JarvisService.java android/app/src/main/java/com/levy/jarvis/JarvisService.java -Force
          Copy-Item v4/android/NetworkClient.java android/app/src/main/java/com/levy/jarvis/NetworkClient.java -Force
          Copy-Item v4/android/StateSocket.java android/app/src/main/java/com/levy/jarvis/StateSocket.java -Force
          Copy-Item v4/android/JarvisConfig.java android/app/src/main/java/com/levy/jarvis/JarvisConfig.java -Force
          Copy-Item v4/android/BootReceiver.java android/app/src/main/java/com/levy/jarvis/BootReceiver.java -Force
          Copy-Item v4/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml -Force
          Copy-Item v4/android/app-build.gradle android/app/build.gradle -Force
          [IO.File]::WriteAllBytes('android/jarvis-release.jks',[Convert]::FromBase64String((Get-Content v4/jarvis-release.jks.b64 -Raw).Trim()))

          python -c "from pathlib import Path; ps=sorted(Path('v41').glob('part*')); Path('v41/patch_41.py').write_text(''.join(p.read_text(encoding='utf-8') for p in ps), encoding='utf-8')"
          python -m py_compile v41/patch_41.py
          python v41/patch_41.py
          python -m py_compile pc/jarvis_app.py
          Write-Host 'JARVIS 4.1 sources prepared and validated.'

      - name: Generate one pairing secret for PC and the same APK
        shell: pwsh
        run: |
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $secret = -join ($bytes | ForEach-Object { $_.ToString('x2') })
          $pc = Get-Content pc/jarvis_app.py -Raw
          $pc = $pc.Replace('__JARVIS_SECRET__', $secret)
          Set-Content pc/jarvis_app.py $pc -Encoding utf8
          $cfg = 'android/app/src/main/java/com/levy/jarvis/JarvisConfig.java'
          $java = Get-Content $cfg -Raw
          $java = $java.Replace('__JARVIS_SECRET__', $secret)
          Set-Content $cfg $java -Encoding utf8
          Write-Host 'Pairing generated without printing secret.'

      - name: Validate compatibility
        shell: pwsh
        run: |
          python -m py_compile pc/jarvis_app.py
          if (!(Select-String -Path android/app/build.gradle -Pattern 'minSdk 25' -Quiet)) { throw 'Android minSdk must stay 25 for the tablet' }
          if (!(Select-String -Path android/app/build.gradle -Pattern 'versionName "4.1"' -Quiet)) { throw 'Android version 4.1 patch missing' }
          if (!(Test-Path android/jarvis-release.jks)) { throw 'Stable signing key missing' }

      - name: Install PC build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r pc/requirements-build.txt

      - name: Build Jarvis.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name Jarvis `
            --collect-all piper `
            --collect-all onnxruntime `
            --collect-all websockets `
            --collect-all mss `
            --hidden-import pystray._win32 `
            pc/jarvis_app.py
          if (!(Test-Path dist/Jarvis.exe)) { throw 'Jarvis.exe was not generated' }

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build the same Jarvis.apk for tablet and Motorola
        shell: pwsh
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          if (!(Test-Path app/build/outputs/apk/debug/app-debug.apk)) { throw 'Jarvis.apk was not generated' }

      - name: Prepare JARVIS 4.1 package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ready/app-android | Out-Null
          New-Item -ItemType Directory -Force ready/servidor | Out-Null
          New-Item -ItemType Directory -Force ready/painel-web | Out-Null
          Copy-Item android/app/build/outputs/apk/debug/app-debug.apk ready/app-android/Jarvis.apk
          Copy-Item dist/Jarvis.exe ready/servidor/Jarvis.exe
          Copy-Item v4/painel-web/index.html ready/painel-web/index.html
          @'
          J.A.R.V.I.S 4.1 — MULTI-DEVICE

          CORREÇÕES 4.1
          - Corrigido texto português quebrado como configuraÃ§Ãµes/nÃ£o.
          - O texto falado é limpo antes do TTS: sem asteriscos, Markdown, emojis, links ou símbolos decorativos.
          - Groq é decodificada explicitamente em UTF-8.
          - Comandos simples de Android são executados antes da IA: Bluetooth, volume, abrir app e bloquear/desligar tela.
          - Comandos para tablet/outro celular podem ser roteados ao Android correto via WebSocket.
          - Volume percentual no PC é tratado localmente.
          - ADB do instalador usa uma porta própria (5041), evitando conflito com outro adb.exe na porta 5037.

          MONITOR PC LOCAL
          - Dentro do MESMO Jarvis.apk existe o botão MONITOR PC (LOCAL).
          - Ele espelha a tela principal do PC no tablet ou Motorola pela rede Wi-Fi local.
          - As imagens da tela NÃO são enviadas para Groq nem para qualquer nuvem.
          - O endpoint de tela exige o segredo do APK e aceita somente cliente de rede local.
          - Este modo é espelhamento da tela do PC. Não é ainda o modo Windows "Estender área de trabalho" com monitor virtual independente.

          DISPOSITIVOS
          - O tablet pode ficar como Painel principal do Jarvis.
          - O Motorola pode ficar como Terminal opcional e entrar quando for usado.
          - O mesmo Jarvis.apk funciona nos dois (Android 7.1+ / API 25+).

          INSTALAÇÃO
          1. Extraia o ZIP inteiro.
          2. Feche o Jarvis antigo e abra servidor/Jarvis.exe.
          3. A chave Groq salva no Windows deve continuar disponível.
          4. Use Instalar APK para atualizar cada Android.
          5. No tablet escolha Painel Jarvis. No Motorola, Terminal Jarvis quando quiser usar voz.
          '@ | Set-Content ready/README.txt -Encoding utf8
          Compress-Archive -Path ready/* -DestinationPath JARVIS_4_1_MULTI_DEVICE.zip -Force
          Get-ChildItem ready -Recurse | Format-Table FullName,Length
          Get-Item JARVIS_4_1_MULTI_DEVICE.zip | Format-List Name,Length

      - name: Upload JARVIS 4.1 final package
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-4.1-MULTI-DEVICE
          path: JARVIS_4_1_MULTI_DEVICE.zip
          retention-days: 30
          compression-level: 0

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh issue create --title "JARVIS 4.1 MULTI-DEVICE build SUCESSO - run $env:GITHUB_RUN_ID" --body "UTF-8/TTS corrigido + ADB isolado + ações Android remotas + Monitor PC local. Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh issue create --title "JARVIS 4.1 MULTI-DEVICE build FALHOU - run $env:GITHUB_RUN_ID" --body "A build JARVIS 4.1 falhou. Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
