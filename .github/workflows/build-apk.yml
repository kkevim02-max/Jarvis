name: Build JARVIS 3.0 PC + Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-v3:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore JARVIS 3.0 source payload
        shell: pwsh
        run: |
          python -c "import base64,gzip,pathlib; parts=sorted(pathlib.Path('v3_payload').glob('part*')); raw=''.join(p.read_text().strip() for p in parts); pathlib.Path('v3_payload/payload.tar.gz').write_bytes(base64.b64decode(raw))"
          tar -xzf v3_payload/payload.tar.gz
          python -m py_compile pc/jarvis_app.py
          Write-Host 'JARVIS 3.0 payload restored.'

      - name: Generate one pairing secret for PC and APK
        shell: pwsh
        run: |
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $secret = -join ($bytes | ForEach-Object { $_.ToString('x2') })
          Set-Content -Path jarvis_secret.txt -Value $secret -NoNewline -Encoding ascii

          $pc = Get-Content pc/jarvis_app.py -Raw
          $pc = $pc.Replace('__JARVIS_SECRET__', $secret)
          Set-Content pc/jarvis_app.py $pc -Encoding utf8

          $cfg = 'android/app/src/main/java/com/levy/jarvis/JarvisConfig.java'
          $java = Get-Content $cfg -Raw
          $java = $java.Replace('__JARVIS_SECRET__', $secret)
          Set-Content $cfg $java -Encoding utf8

          Write-Host 'Pairing prepared (secret not printed).'

      - name: Install Windows app build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r pc/requirements-build.txt

      - name: Syntax check PC app
        shell: pwsh
        run: |
          python -m py_compile pc/jarvis_app.py

      - name: Build Jarvis.exe (no console)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name Jarvis `
            --collect-all kokoro_onnx `
            --collect-all espeakng_loader `
            --collect-all phonemizer `
            --collect-all onnxruntime `
            --hidden-import pystray._win32 `
            pc/jarvis_app.py
          if (!(Test-Path dist/Jarvis.exe)) { throw 'Jarvis.exe was not generated' }
          Get-Item dist/Jarvis.exe | Format-List Name,Length

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: pwsh
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Jarvis 3.0 APK
        shell: pwsh
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          if (!(Test-Path app/build/outputs/apk/debug/app-debug.apk)) { throw 'Jarvis.apk was not generated' }

      - name: Prepare clean-install package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ready | Out-Null
          Copy-Item dist/Jarvis.exe ready/Jarvis.exe
          Copy-Item android/app/build/outputs/apk/debug/app-debug.apk ready/Jarvis.apk
          Copy-Item jarvis_secret.txt ready/jarvis_secret.txt
          @'
          J.A.R.V.I.S 3.0 — INSTALAÇÃO LIMPA

          1. Extraia esta pasta inteira.
          2. Abra Jarvis.exe.
          3. Na primeira execução ele instala/repara automaticamente Ollama, a IA selecionada,
             Whisper.cpp e a voz Kokoro, tudo sem deixar janelas CMD abertas.
          4. Conecte o Motorola por USB e use o botão "Instalar APK no celular".
          5. Depois disso o uso normal é por Wi-Fi. O USB/ADB fica só para instalação/manutenção.

          O Jarvis.exe:
          - roda na bandeja e em segundo plano;
          - pode iniciar com o Windows;
          - gerencia Ollama e o núcleo local;
          - mostra status do PC/celular/modelo;
          - possui perfis Rápido, Equilibrado e Inteligente;
          - mantém ações de PC em lista permitida, sem executar comandos arbitrários da IA.

          O Jarvis.apk 3.0:
          - corrige o ForegroundService do Android 9;
          - só inicia o microfone depois da permissão;
          - reconecta ao PC automaticamente por Wi-Fi;
          - usa "Ei, mano" e "Jarvis" como chamadas;
          - mantém ganho alto para o microfone fraco;
          - continua ativo em segundo plano.
          '@ | Set-Content ready/LEIA-ME.txt -Encoding utf8

          Compress-Archive -Path ready/* -DestinationPath JARVIS_3_0_INSTALACAO_LIMPA.zip -Force
          Get-ChildItem ready | Format-Table Name,Length
          Get-Item JARVIS_3_0_INSTALACAO_LIMPA.zip | Format-List Name,Length

      - name: Upload JARVIS 3.0 complete package
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-3.0-INSTALACAO-LIMPA
          path: |
            JARVIS_3_0_INSTALACAO_LIMPA.zip
            ready/Jarvis.exe
            ready/Jarvis.apk
            ready/LEIA-ME.txt
          retention-days: 30
          compression-level: 0

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh issue create --title "JARVIS 3.0 build SUCESSO - run $env:GITHUB_RUN_ID" --body "Jarvis.exe + Jarvis.apk 3.0 compilados. Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh issue create --title "JARVIS 3.0 build FALHOU - run $env:GITHUB_RUN_ID" --body "A build 3.0 falhou. Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
