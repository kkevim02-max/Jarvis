name: Build Jarvis APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: |
          mkdir -p appsrc/project
          unzip -q jarvis_android_src.zip -d appsrc/project

      - name: Generate private pairing secret
        shell: bash
        run: |
          SECRET=$(openssl rand -hex 24)
          echo "$SECRET" > appsrc/jarvis_secret.txt
          sed -i "s/__JARVIS_SECRET__/$SECRET/g" appsrc/project/app/src/main/java/com/levy/jarvis/JarvisConfig.java

      - name: Build APK
        working-directory: appsrc/project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare download package
        run: |
          mkdir -p ready
          cp appsrc/project/app/build/outputs/apk/debug/app-debug.apk ready/Jarvis.apk
          cp appsrc/jarvis_secret.txt ready/jarvis_secret.txt
          cat > ready/LEIA-ME.txt <<'EOF'
          JARVIS APK PRONTO

          - Jarvis.apk: instale no Motorola.
          - jarvis_secret.txt: segredo exclusivo para conectar o APK ao núcleo do PC.
          EOF

      - name: Upload Jarvis APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK-Pronto
          path: ready/
          retention-days: 30
