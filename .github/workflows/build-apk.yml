name: Build Jarvis APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Jarvis with diagnostics
        id: jarvis_build
        shell: bash
        run: |
          set +e
          {
            echo '=== Android SDK ==='
            sdkmanager "platforms;android-35" "build-tools;35.0.0"

            echo '=== Validando partes do projeto ==='
            echo 'c9de70cc500d3c92f150ff5f87117bd25c6a0d12b3822ef62de84338d436d655  project.parts/part01.b64' | sha256sum -c - || exit 41
            echo '3d5e21e15c98176f53221f57ba78a717925a0c25cccb7b44cbc2a6169c7a049a  project.parts/part02.b64' | sha256sum -c - || exit 42
            echo 'cf09e649b04a4740fc99a781c66778c013d855769abcc3ebc306b84a01b4efab  project.parts/part03.b64' | sha256sum -c - || exit 43
            echo '2117794d21ada992f3bdb805c6eb98b4fd2dd84eff16db8d61bbb75f0dbdf295  project.parts/part04.b64' | sha256sum -c - || exit 44

            echo '=== Reconstruindo projeto Android ==='
            cat project.parts/part01.b64 project.parts/part02.b64 project.parts/part03.b64 project.parts/part04.b64 > project.full.b64
            base64 -d project.full.b64 > jarvis_android_rebuilt.zip || exit 45
            echo '7351529ccc6bacd9407f2ff469a8c535582dc9eb18d61f5585b5eb20478d8c32  jarvis_android_rebuilt.zip' | sha256sum -c - || exit 46

            echo '=== Testando ZIP reconstruído ==='
            unzip -t jarvis_android_rebuilt.zip || exit 47

            echo '=== Extraindo projeto ==='
            rm -rf appsrc
            mkdir -p appsrc/project
            unzip -q jarvis_android_rebuilt.zip -d appsrc/project || exit 48

            echo '=== Gerando pareamento ==='
            SECRET=$(openssl rand -hex 24)
            echo "$SECRET" > appsrc/jarvis_secret.txt
            sed -i "s/__JARVIS_SECRET__/$SECRET/g" appsrc/project/app/src/main/java/com/levy/jarvis/JarvisConfig.java || exit 49

            echo '=== Compilando APK ==='
            cd appsrc/project
            gradle assembleDebug --no-daemon --stacktrace || exit 50
          } 2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report build error automatically
        if: steps.jarvis_build.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Falha automática na compilação do JARVIS."
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Código interno: ${{ steps.jarvis_build.outputs.status }}"
            echo
            echo '```text'
            tail -n 400 build.log
            echo '```'
          } > issue_body.md

          gh issue create \
            --title "JARVIS build falhou - run $GITHUB_RUN_ID" \
            --body-file issue_body.md

          exit 1

      - name: Prepare download package
        if: steps.jarvis_build.outputs.status == '0'
        run: |
          mkdir -p ready
          cp appsrc/project/app/build/outputs/apk/debug/app-debug.apk ready/Jarvis.apk
          cp appsrc/jarvis_secret.txt ready/jarvis_secret.txt
          cat > ready/LEIA-ME.txt <<'EOF'
          JARVIS APK PRONTO

          - Jarvis.apk: instale no Motorola.
          - jarvis_secret.txt: segredo exclusivo para conectar o APK ao núcleo do PC.
          EOF

      - name: Upload Jarvis APK
        if: steps.jarvis_build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK-Pronto
          path: ready/
          retention-days: 30

      - name: Report success automatically
        if: steps.jarvis_build.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create \
            --title "JARVIS build SUCESSO - run $GITHUB_RUN_ID" \
            --body "APK compilado com sucesso. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
