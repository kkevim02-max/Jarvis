name: Build Jarvis APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Jarvis with diagnostics
        id: jarvis_build
        shell: bash
        run: |
          set +e
          {
            echo '=== Android SDK ==='
            sdkmanager "platforms;android-35" "build-tools;35.0.0" || exit 41

            echo '=== Preparando projeto Android direto ==='
            rm -rf appsrc
            mkdir -p appsrc
            cp -R android appsrc/project || exit 42
            test -f appsrc/project/settings.gradle || exit 43
            test -f appsrc/project/app/src/main/java/com/levy/jarvis/MainActivity.java || exit 44

            echo '=== Gerando pareamento ==='
            SECRET=$(openssl rand -hex 24)
            echo "$SECRET" > appsrc/jarvis_secret.txt
            sed -i "s/__JARVIS_SECRET__/$SECRET/g" appsrc/project/app/src/main/java/com/levy/jarvis/JarvisConfig.java || exit 45

            echo '=== Ajustando microfone para alta sensibilidade ==='
            SERVICE=appsrc/project/app/src/main/java/com/levy/jarvis/JarvisService.java
            sed -i 's/final double gain = 3.0;/final double gain = 6.0;/' "$SERVICE"
            sed -i 's/double noise = 180.0;/double noise = 110.0;/' "$SERVICE"
            sed -i 's/Math.max(220.0, noise \* 1.9)/Math.max(120.0, noise * 1.5)/' "$SERVICE"
            sed -i 's/while (pre.size() > 5)/while (pre.size() > 7)/' "$SERVICE"
            sed -i 's/if (hotBlocks >= 2)/if (hotBlocks >= 1)/' "$SERVICE"
            sed -i 's/if (silentBlocks >= 8 || speechBlocks >= 90)/if (silentBlocks >= 10 || speechBlocks >= 110)/' "$SERVICE"

            echo '=== Compilando APK ==='
            cd appsrc/project
            gradle assembleDebug --no-daemon --stacktrace || exit 50
          } 2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report build error automatically
        if: steps.jarvis_build.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Falha automática na compilação do JARVIS."
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Código interno: ${{ steps.jarvis_build.outputs.status }}"
            echo
            echo '```text'
            tail -n 400 build.log
            echo '```'
          } > issue_body.md

          gh issue create \
            --title "JARVIS build falhou - run $GITHUB_RUN_ID" \
            --body-file issue_body.md

          exit 1

      - name: Prepare download package
        if: steps.jarvis_build.outputs.status == '0'
        run: |
          mkdir -p ready
          cp appsrc/project/app/build/outputs/apk/debug/app-debug.apk ready/Jarvis.apk
          cp appsrc/jarvis_secret.txt ready/jarvis_secret.txt
          cat > ready/LEIA-ME.txt <<'EOF'
          JARVIS APK PRONTO

          - Jarvis.apk: instale no Motorola.
          - jarvis_secret.txt: segredo exclusivo para conectar o APK ao núcleo do PC.
          - Esta build usa sensibilidade alta de microfone e ganho digital 6x.
          EOF

      - name: Upload Jarvis APK
        if: steps.jarvis_build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK-Pronto
          path: ready/
          retention-days: 30

      - name: Report success automatically
        if: steps.jarvis_build.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create \
            --title "JARVIS build SUCESSO - run $GITHUB_RUN_ID" \
            --body "APK compilado com sucesso. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
