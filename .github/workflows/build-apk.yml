name: Build JARVIS 3.1.1 Cloud PC + Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-v311:
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Android 3.x source payload and apply 3.1.1 patch
        shell: pwsh
        run: |
          python -c "import base64,pathlib; parts=sorted(pathlib.Path('v3_payload').glob('part*')); raw=''.join(p.read_text().strip() for p in parts); pathlib.Path('v3_payload/payload.tar.gz').write_bytes(base64.b64decode(raw))"
          tar -xzf v3_payload/payload.tar.gz
          Copy-Item v31/jarvis_app.py pc/jarvis_app.py -Force
          Copy-Item v31/requirements-build.txt pc/requirements-build.txt -Force
          python v31/patch_311.py

          $gradle = Get-Content android/app/build.gradle -Raw
          $gradle = [regex]::Replace($gradle, 'versionCode\s+\d+', 'versionCode 311')
          $gradle = [regex]::Replace($gradle, 'versionName\s+"[^"]+"', 'versionName "3.1.1"')
          Set-Content android/app/build.gradle $gradle -Encoding utf8

          Get-ChildItem android/app/src/main/java/com/levy/jarvis/*.java | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            $c = $c.Replace('J.A.R.V.I.S 3.0', 'J.A.R.V.I.S 3.1.1').Replace('• 3.0', '• 3.1.1').Replace(' 3.0', ' 3.1.1')
            Set-Content $_.FullName $c -Encoding utf8
          }

          python -m py_compile pc/jarvis_app.py
          Write-Host 'JARVIS 3.1.1 source prepared.'

      - name: Generate one pairing secret for PC and APK
        shell: pwsh
        run: |
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $secret = -join ($bytes | ForEach-Object { $_.ToString('x2') })
          Set-Content -Path jarvis_secret.txt -Value $secret -NoNewline -Encoding ascii

          $pc = Get-Content pc/jarvis_app.py -Raw
          $pc = $pc.Replace('__JARVIS_SECRET__', $secret)
          Set-Content pc/jarvis_app.py $pc -Encoding utf8

          $cfg = 'android/app/src/main/java/com/levy/jarvis/JarvisConfig.java'
          $java = Get-Content $cfg -Raw
          $java = $java.Replace('__JARVIS_SECRET__', $secret)
          Set-Content $cfg $java -Encoding utf8
          Write-Host 'Pairing prepared (secret not printed).'

      - name: Install Windows app build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r pc/requirements-build.txt

      - name: Syntax check PC app
        shell: pwsh
        run: python -m py_compile pc/jarvis_app.py

      - name: Build Jarvis.exe (no console)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name Jarvis `
            --collect-all piper `
            --collect-all onnxruntime `
            --hidden-import pystray._win32 `
            pc/jarvis_app.py
          if (!(Test-Path dist/Jarvis.exe)) { throw 'Jarvis.exe was not generated' }
          Get-Item dist/Jarvis.exe | Format-List Name,Length

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Jarvis 3.1.1 APK
        shell: pwsh
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          if (!(Test-Path app/build/outputs/apk/debug/app-debug.apk)) { throw 'Jarvis.apk was not generated' }

      - name: Prepare final package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ready | Out-Null
          Copy-Item dist/Jarvis.exe ready/Jarvis.exe
          Copy-Item android/app/build/outputs/apk/debug/app-debug.apk ready/Jarvis.apk
          @'
          J.A.R.V.I.S 3.1.1 CLOUD

          CORREÇÕES E MELHORIAS:
          - Corrigido o problema da voz que não saía no Jarvis 3.1.
          - Nova voz masculina pt-BR local com Piper.
          - Controle de volume do JARVIS de 0 a 100% dentro do Jarvis.exe.
          - Botão MUTAR/DESMUTAR JARVIS.
          - O volume do Jarvis é aplicado no áudio da própria voz e NÃO muda o volume da música do celular.
          - Groq continua cuidando do Whisper Large V3 Turbo e GPT-OSS 20B.
          - A chave Groq permanece salva no Windows; a pasta de dados continua em Jarvis31.

          INSTALAÇÃO:
          1. Extraia a pasta inteira.
          2. Feche o Jarvis 3.1 antigo e abra este Jarvis.exe.
          3. A chave Groq já deve continuar salva no mesmo Windows.
          4. Aguarde aparecer que a voz masculina está pronta. Na primeira vez ele baixa o modelo de voz.
          5. Conecte o Motorola por USB e clique em "Instalar APK no celular" para sincronizar o novo pareamento.
          6. Depois use normalmente por Wi-Fi.
          '@ | Set-Content ready/LEIA-ME.txt -Encoding utf8

          Compress-Archive -Path ready/* -DestinationPath JARVIS_3_1_1_CLOUD_FINAL.zip -Force
          Get-ChildItem ready | Format-Table Name,Length
          Get-Item JARVIS_3_1_1_CLOUD_FINAL.zip | Format-List Name,Length

      - name: Upload JARVIS 3.1.1 final package
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-3.1.1-CLOUD-FINAL
          path: JARVIS_3_1_1_CLOUD_FINAL.zip
          retention-days: 30
          compression-level: 0

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh issue create --title "JARVIS 3.1.1 CLOUD build SUCESSO - run $env:GITHUB_RUN_ID" --body "Voz corrigida + volume independente + mute. Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh issue create --title "JARVIS 3.1.1 CLOUD build FALHOU - run $env:GITHUB_RUN_ID" --body "A build 3.1.1 falhou. Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
