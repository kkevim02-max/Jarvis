name: Build Jarvis APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode Android project
        run: |
          mkdir -p appsrc
          base64 -d project.b64 > appsrc/project.zip
          unzip -q appsrc/project.zip -d appsrc/project

      - name: Generate private pairing secret
        id: secret
        shell: bash
        run: |
          SECRET=$(openssl rand -hex 24)
          echo "secret=$SECRET" >> "$GITHUB_OUTPUT"
          echo "$SECRET" > appsrc/jarvis_secret.txt
          sed -i "s/__JARVIS_SECRET__/$SECRET/g" appsrc/project/app/src/main/java/com/levy/jarvis/JarvisConfig.java

      - name: Build APK
        working-directory: appsrc/project
        run: gradle assembleDebug --no-daemon

      - name: Prepare download package
        run: |
          mkdir -p ready
          cp appsrc/project/app/build/outputs/apk/debug/app-debug.apk ready/Jarvis.apk
          cp appsrc/jarvis_secret.txt ready/jarvis_secret.txt
          cat > ready/LEIA-ME.txt <<'EOF'
          JARVIS APK PRONTO

          1. Instale Jarvis.apk no Motorola.
          2. Guarde jarvis_secret.txt: ele é o segredo exclusivo desta compilação.
          3. O núcleo do PC precisa usar o mesmo segredo para conversar com o APK.
          EOF

      - name: Upload Jarvis APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK-Pronto
          path: ready/
          retention-days: 30
