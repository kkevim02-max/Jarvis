plugins {
    id 'com.android.application'
}

android {
    namespace 'com.levy.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId "com.levy.jarvis"
        minSdk 28
        targetSdk 28
        versionCode 20
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
